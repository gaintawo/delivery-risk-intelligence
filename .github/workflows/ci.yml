name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-pipeline.txt -r requirements-model.txt -r requirements-monitoring.txt ruff==0.16.9
      - name: Lint
        run: ruff check src tests api dashboard
      - name: Unit tests
        env:
          GX_ANALYTICS_ENABLED: "false"
        run: pytest -q

  pipeline-docker:
    name: Build container and run pipeline on Olist data
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dri-pipeline .
      - name: Unit tests inside the container
        run: docker run --rm --entrypoint pytest dri-pipeline -q -p no:cacheprovider --ignore=tests/test_structure.py
      - name: Run full pipeline in the container
        run: |
          mkdir -p data logs docs/evidence gx-out
          chmod -R 777 data logs docs/evidence gx-out
          docker run --rm \
            -v "$PWD/data:/app/data" -v "$PWD/logs:/app/logs" \
            -v "$PWD/docs/evidence:/app/docs/evidence" -v "$PWD/gx-out:/app/gx/uncommitted" \
            -e DRI_HASH_SALT="${{ secrets.DRI_HASH_SALT || 'ci-only-salt' }}" \
            dri-pipeline
          ls -la data/processed docs/evidence
          tail -n 3 logs/audit.log
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: |
            docs/evidence
            logs/audit.log
            gx-out/data_docs
            data/processed/dashboard_feed.csv

  compose:
    name: Docker Compose smoke test (API, dashboard, Prometheus, Grafana)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 300 api dashboard prometheus grafana
      - name: Score an order through the API and read it back from the explanation store
        run: |
          curl -fsS localhost:8000/health
          ID=$(curl -fsS -X POST localhost:8000/predict -H 'Content-Type: application/json' -d '{
            "promised_days": 18, "purchase_dow": 4, "purchase_month": 11, "purchase_hour": 21,
            "is_peak_season": 1, "distance_km": 2110, "interstate": 1, "price_total": 129.9,
            "freight_total": 38.5, "weight_total_g": 1800, "volume_total_cm3": 9000,
            "seller_hist_orders": 42, "seller_hist_late_rate": 0.19, "seller_hist_handling_days": 3.4,
            "customer_state": "BA", "seller_state": "SP", "customer_region": "Northeast",
            "primary_category": "health_beauty", "payment_type": "boleto"}' | python -c "import sys,json; r=json.load(sys.stdin); print(r, file=sys.stderr); print(r['prediction_id'])")
          curl -fsS localhost:8000/explanations/$ID
      - name: Prometheus scrapes the API; Grafana and the dashboard are up
        run: |
          for i in $(seq 1 20); do
            curl -fsS 'localhost:9090/api/v1/query?query=dri_predictions_total' | grep -q dri_predictions_total && break
            sleep 5
          done
          curl -fsS 'localhost:9090/api/v1/query?query=dri_predictions_total' | grep dri_predictions_total
          curl -fsS localhost:3000/api/health
          curl -fsS 'localhost:3000/api/search?query=DRI' | grep -q dri-api
          curl -fsS localhost:8501/_stcore/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v
